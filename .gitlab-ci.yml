# Flowboard — CI/CD GitLab
#
# verify  : lint (ESLint + types) et format (Prettier)
# test    : tests unitaires et API (Jest + service MongoDB), recette navigateur (Playwright)
# build   : images Docker web et api, construites en parallèle, poussées avec le SHA du commit
# smoke   : la pile web → api → mongo démarre avec ces images et répond à travers nginx
# release : étiquettes `latest` (branche par défaut) et `<tag git>` (version)
# deploy  : déploiement manuel en production par SSH (sauvegarde préalable automatique)
#
# Variables CI/CD à définir (Settings → CI/CD → Variables) pour le déploiement :
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH  serveur cible et dossier contenant docker-compose.yml et .env
#   SSH_PRIVATE_KEY (type fichier), SSH_KNOWN_HOSTS
# et un deploy token nommé « gitlab-deploy-token » (read_registry) : fournit CI_DEPLOY_USER / CI_DEPLOY_PASSWORD.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [verify, test, build, smoke, release, deploy]

variables:
  npm_config_cache: $CI_PROJECT_DIR/.npm
  npm_config_audit: 'false'
  npm_config_fund: 'false'

default:
  interruptible: true

# ---------- Modèles ----------
.node:
  image: node:24-slim
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --prefer-offline

.docker:
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# ---------- verify ----------
lint:
  extends: .node
  stage: verify
  script:
    - npm run build -w @flowboard/shared
    - npm run lint
    - npx prettier --check apps packages e2e

# ---------- test ----------
test:
  extends: .node
  stage: test
  needs: []
  services:
    - name: mongo:7
      alias: mongo
  variables:
    TEST_MONGO_URL: mongodb://mongo:27017
  script:
    - npm run build -w @flowboard/shared
    - npm test

e2e:
  extends: .node
  stage: test
  needs: []
  # Navigateur fourni par l'image, même version que @playwright/test (package-lock.json).
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  services:
    - name: mongo:7
      alias: mongo
  variables:
    TEST_MONGO_URL: mongodb://mongo:27017
  script:
    - npm run build
    - npx playwright test --reporter=line
  artifacts:
    when: on_failure
    paths: [test-results/]
    expire_in: 1 week

# ---------- build : deux images distinctes ----------
build:
  extends: .docker
  stage: build
  needs: [lint, test, e2e]
  parallel:
    matrix:
      - APP: [api, web]
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/flow-board-$APP"
    - docker pull "$IMAGE:latest" || true
    - >
      docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from "$IMAGE:latest"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      -f "apps/$APP/Dockerfile"
      -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"

# ---------- smoke : les images construites fonctionnent ensemble ----------
smoke:
  extends: .docker
  stage: smoke
  needs: [build]
  variables:
    REGISTRY: $CI_REGISTRY_IMAGE
    TAG: $CI_COMMIT_SHORT_SHA
    ADMIN_USERNAME: admin
    ADMIN_PASSWORD: smoke-test-password
    COOKIE_SECURE: 'false'
  script:
    - docker compose pull web api
    - docker compose up -d --no-build
    # La SPA, la santé de l'API (MongoDB compris) et une connexion, toutes à travers nginx.
    - >
      for i in $(seq 1 60); do
      docker compose exec -T web wget -q -O /dev/null http://127.0.0.1:8080/api/health && break; sleep 2;
      done
    - docker compose exec -T web wget -q -O - http://127.0.0.1:8080/ | grep -q '<div id="root">'
    - >
      docker compose exec -T web wget -q -O - --header 'x-flowboard-csrf: 1' --header 'content-type: application/json'
      --post-data '{"username":"admin","password":"smoke-test-password"}' http://127.0.0.1:8080/api/auth/login
      | grep -q '"mustChangePassword":true'
  after_script:
    - docker compose logs --no-color > smoke.log 2>&1 || true
    - docker compose down -v || true
  artifacts:
    when: on_failure
    paths: [smoke.log]
    expire_in: 1 week

# ---------- release ----------
release:
  extends: .docker
  stage: release
  needs: [smoke]
  rules:
    - if: $CI_COMMIT_TAG
      variables: { RELEASE_TAG: $CI_COMMIT_TAG }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: { RELEASE_TAG: latest }
  script:
    - |
      for APP in api web; do
        IMAGE="$CI_REGISTRY_IMAGE/flow-board-$APP"
        docker pull "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$RELEASE_TAG"
        docker push "$IMAGE:$RELEASE_TAG"
      done

# ---------- deploy ----------
deploy:
  stage: deploy
  needs: [release]
  image: alpine:3.20
  interruptible: false
  resource_group: production
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      when: manual
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - chmod 600 "$SSH_PRIVATE_KEY" && ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - TARGET="$DEPLOY_USER@$DEPLOY_HOST"
    - ssh "$TARGET" "mkdir -p '$DEPLOY_PATH/scripts'"
    - scp docker-compose.yml "$TARGET:$DEPLOY_PATH/docker-compose.yml"
    - scp scripts/backup.sh scripts/restore.sh "$TARGET:$DEPLOY_PATH/scripts/"
    # Sauvegarde avant mise à jour (si la pile tourne déjà), puis bascule sur les images du commit.
    - >
      ssh "$TARGET" "set -e; cd '$DEPLOY_PATH';
      echo '$CI_DEPLOY_PASSWORD' | docker login -u '$CI_DEPLOY_USER' --password-stdin '$CI_REGISTRY';
      if docker compose ps -q api | grep -q .; then sh scripts/backup.sh backups 14; fi;
      export REGISTRY='$CI_REGISTRY_IMAGE' TAG='$CI_COMMIT_SHORT_SHA';
      docker compose pull web api;
      docker compose up -d --no-build --remove-orphans;
      docker image prune -f"
