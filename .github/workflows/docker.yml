# Vérifie puis construit les deux images (api, web) et les publie sur Docker Hub.
#   push sur main      → librehubstore/flow-board-api (et -web) :latest, :sha-<court> (master : :sha-<court> seul)
#   tag vX.Y.Z         → librehubstore/flow-board-api (et -web) :X.Y.Z, :X.Y
#   pull request       → build seul (aucune publication)
# Configuration du dépôt GitHub (Settings → Secrets and variables → Actions) :
#   secrets   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (jeton d'accès Docker Hub, droits Read & Write)
#   variable  DOCKERHUB_NAMESPACE (facultative, défaut : librehubstore)
name: docker

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      TEST_MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx prettier --check apps packages e2e
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  image:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    env:
      IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'librehubstore' }}/flow-board-${{ matrix.app }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Contexte : racine du monorepo (packages/shared est requis par les deux images).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
